<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SCADA - Monitoreo de Generador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .metrics-panel { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; gap: 20px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; width: 45%; box-sizing: border-box; transition: background 0.3s; }
        .scada-container { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 20px; background: #2c2c2c; padding: 20px; border-radius: 8px; flex-wrap: wrap; }
        .motor-box { background: #6c757d; padding: 25px; border-radius: 8px; font-weight: bold; color: #fff; transition: background 0.3s; }
        
        /* Contenedor del Tanque de Combustible */
        .tanque-wrapper { width: 70px; height: 140px; border: 3px solid #ccc; border-radius: 6px; position: relative; background: #111; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .tanque-nivel { width: 100%; height: 0%; transition: height 0.5s ease, background-color 0.5s ease; }
        .label-component { font-size: 0.85rem; margin-top: 5px; color: #aaa; font-weight: bold; }

        /* Estilo para el Termómetro SVG y Mensaje */
        .termometro-box { display: flex; flex-direction: column; align-items: center; }
        .temp-svg { width: 60px; height: 140px; background: #111; border: 3px solid #ccc; border-radius: 30px; padding: 5px; box-sizing: border-box; }

        /* Mensajes de Estado */
        #temp-estado, #comb-estado { font-size: 0.95rem; font-weight: bold; margin-top: 8px; min-height: 24px; }

        /* Estilo para la Alerta General y Crítica */
        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        .alerta-desconexion {
            color: #dc3545;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            animation: parpadeo 1s infinite;
            display: none; 
        }
        .alerta-critica {
            color: #dc3545;
            animation: parpadeo 0.8s infinite;
        }

        /* --- Animación de Derrame de Combustible --- */
        /* Cuando el tanque llega a >=99%, se activa la clase "derrame" en el
           wrapper: se permite que el contenido se desborde (overflow: visible)
           y se agregan dos "gotas" (::before y ::after) que caen goteando
           desde el borde superior del tanque en un loop continuo. */
        .tanque-wrapper.derrame {
            overflow: visible;
            border-color: #fd7e14;
            animation: parpadeo-borde 0.8s infinite;
        }
        @keyframes parpadeo-borde {
            0% { box-shadow: 0 0 0px rgba(253, 126, 20, 0); }
            50% { box-shadow: 0 0 12px rgba(253, 126, 20, 0.9); }
            100% { box-shadow: 0 0 0px rgba(253, 126, 20, 0); }
        }
        .tanque-wrapper.derrame::before,
        .tanque-wrapper.derrame::after {
            content: "";
            position: absolute;
            top: -2px;
            width: 8px;
            height: 12px;
            background: #fd7e14;
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            animation: gotear 1.2s infinite ease-in;
            z-index: 5;
        }
        .tanque-wrapper.derrame::before { left: -6px; animation-delay: 0s; }
        .tanque-wrapper.derrame::after { right: -6px; animation-delay: 0.6s; }
        @keyframes gotear {
            0% { top: -2px; opacity: 1; }
            70% { opacity: 1; }
            100% { top: 45px; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel SCADA - Generador Principal</h2>

        <!-- Mensaje de Alerta por Desconexión -->
        <div id="alerta-offline" class="alerta-desconexion">::: ALERTA ::: Terminal sin conexion</div>

        <!-- Esquema Visual SCADA -->
        <div class="scada-container">
            <!-- Bloque Motor -->
            <div id="motor-box" class="motor-box">
                MOTOR / CUMMINS
            </div>

            <!-- Termómetro SVG -->
            <div class="termometro-box">
                <svg class="temp-svg" viewBox="0 0 40 120">
                    <rect x="16" y="10" width="8" height="85" rx="4" fill="#222" />
                    <rect id="term-liquido" x="16" y="95" width="8" height="0" rx="4" fill="#007bff" />
                    <circle cx="20" cy="100" r="12" fill="#007bff" id="term-bulbo" />
                </svg>
                <div class="label-component">TEMPERATURA</div>
            </div>

            <!-- Tanque de Combustible -->
            <div>
                <div class="tanque-wrapper" id="tanque-wrapper">
                    <div id="tanque-nivel" class="tanque-nivel"></div>
                </div>
                <div class="label-component">COMBUSTIBLE</div>
            </div>
        </div>

        <!-- Mensajes Dinámicos del Estado -->
        <div style="display: flex; justify-content: space-around; margin-top: 10px;">
            <div id="temp-estado" style="width: 50%;">Esperando datos de temperatura...</div>
            <div id="comb-estado" style="width: 50%;">Esperando datos de combustible...</div>
        </div>

        <!-- Tarjetas de Métricas Numéricas -->
        <div class="metrics-panel">
            <div class="card" id="card-temp">
                <h3>Temperatura</h3>
                <h2 id="temp-val">-- °C</h2>
            </div>
            <div class="card" id="card-comb">
                <h3>Combustible</h3>
                <h2 id="comb-val">-- %</h2>
            </div>
        </div>
    </div>

    <script>
        let ultimaActualizacion = Date.now();
        const TIEMPO_LIMITE_MS = 10000; // 10 segundos sin datos activa alerta offline

        function actualizarDatos() {
            fetch('/api/estado/1')
                .then(response => response.json())
                .then(data => {
                    if (data.error || data.temperatura === undefined) {
                        return;
                    }

                    ultimaActualizacion = Date.now();

                    // Restaurar interfaz desde estado offline
                    document.getElementById("alerta-offline").style.display = "none";
                    document.getElementById("motor-box").style.background = "#6c757d";
                    document.getElementById("card-temp").style.background = "#2c2c2c";
                    document.getElementById("card-comb").style.background = "#2c2c2c";

                    let temperatura = data.temperatura;
                    let combustible = data.nivel_combustible;

                    // Textos numéricos
                    document.getElementById("temp-val").innerText = temperatura.toFixed(2) + " °C";
                    document.getElementById("comb-val").innerText = combustible.toFixed(1) + " %";

                    // --- LÓGICA DEL TANQUE DE COMBUSTIBLE Y SUS ESTADOS ---
                    let tanqueWrapper = document.getElementById("tanque-wrapper");
                    let barraTanque = document.getElementById("tanque-nivel");
                    let lblCombEstado = document.getElementById("comb-estado");
                    
                    // Altura visual mínima del 4% en 0% para que se mantenga visible y pintada de rojo crítico
                    let alturaVisual = combustible <= 0 ? 4 : combustible;
                    barraTanque.style.height = alturaVisual + "%";

                    if (combustible >= 99) {
                        // Posible derrame: tanque prácticamente lleno al límite
                        tanqueWrapper.classList.add("derrame");
                        barraTanque.style.backgroundColor = "#fd7e14";
                        lblCombEstado.className = "alerta-critica";
                        lblCombEstado.innerHTML = "⚠️ Posible Derrame de Combustible ⚠️";
                    } else if (combustible >= 90) {
                        tanqueWrapper.classList.remove("derrame");
                        barraTanque.style.backgroundColor = "#17a2b8";
                        lblCombEstado.className = "";
                        lblCombEstado.style.color = "#17a2b8";
                        lblCombEstado.innerText = "Tanque Cerca de Llenarse";
                    } else if (combustible <= 0) {
                        tanqueWrapper.classList.remove("derrame");
                        barraTanque.style.backgroundColor = "#dc3545";
                        lblCombEstado.className = "alerta-critica";
                        lblCombEstado.innerHTML = "⚠️ Tanque Vacío / Reserva ⚠️";
                    } else if (combustible > 0 && combustible <= 20) {
                        tanqueWrapper.classList.remove("derrame");
                        barraTanque.style.backgroundColor = "#dc3545"; // Rojo
                        lblCombEstado.className = "";
                        lblCombEstado.style.color = "#dc3545";
                        lblCombEstado.innerText = "Combustible Bajo";
                    } else if (combustible > 20 && combustible <= 30) {
                        tanqueWrapper.classList.remove("derrame");
                        barraTanque.style.backgroundColor = "#fd7e14"; // Naranja
                        lblCombEstado.className = "";
                        lblCombEstado.style.color = "#fd7e14";
                        lblCombEstado.innerText = "Combustible Moderado";
                    } else {
                        tanqueWrapper.classList.remove("derrame");
                        barraTanque.style.backgroundColor = "#28a745"; // Verde
                        lblCombEstado.className = "";
                        lblCombEstado.style.color = "#28a745";
                        lblCombEstado.innerText = "Combustible Normal";
                    }

                    // --- LÓGICA DEL TERMÓMETRO Y ESTADOS DE TEMPERATURA ---
                    let termLiquido = document.getElementById("term-liquido");
                    let termBulbo = document.getElementById("term-bulbo");
                    let lblEstado = document.getElementById("temp-estado");

                    let tempMaxVisual = 50.0;
                    let porcentajeTemp = Math.max(0, Math.min(100, (temperatura / tempMaxVisual) * 100));
                    let alturaPx = (porcentajeTemp * 85) / 100; 

                    let yPos = 95 - alturaPx;
                    termLiquido.setAttribute("y", yPos);
                    termLiquido.setAttribute("height", alturaPx);

                    // Reglas de rangos exactas y sin baches
                    if (temperatura <= 20.0) {
                        let colorTemp = "#007bff"; // Azul
                        termLiquido.setAttribute("fill", colorTemp);
                        termBulbo.setAttribute("fill", colorTemp);
                        lblEstado.className = "";
                        lblEstado.style.color = "#007bff";
                        lblEstado.innerText = "Motor en Frío";
                    } else if (temperatura > 20.0 && temperatura <= 30.0) {
                        let colorTemp = "#28a745"; // Verde
                        termLiquido.setAttribute("fill", colorTemp);
                        termBulbo.setAttribute("fill", colorTemp);
                        lblEstado.className = "";
                        lblEstado.style.color = "#28a745";
                        lblEstado.innerText = "Temp Normal";
                    } else if (temperatura > 30.0 && temperatura <= 37.0) {
                        let colorTemp = "#fd7e14"; // Naranja
                        termLiquido.setAttribute("fill", colorTemp);
                        termBulbo.setAttribute("fill", colorTemp);
                        lblEstado.className = "";
                        lblEstado.style.color = "#fd7e14";
                        lblEstado.innerText = "Motor Caliente";
                    } else {
                        let colorTemp = "#dc3545"; // Rojo (> 37°)
                        termLiquido.setAttribute("fill", colorTemp);
                        termBulbo.setAttribute("fill", colorTemp);
                        lblEstado.className = "alerta-critica";
                        lblEstado.innerHTML = "⚠️ Sobrecalentamiento de Motor ⚠️";
                    }
                })
                .catch(error => console.error("Error al consultar API:", error));
        }

        function comprobarConexion() {
            let tiempoTranscurrido = Date.now() - ultimaActualizacion;

            if (tiempoTranscurrido > TIEMPO_LIMITE_MS) {
                document.getElementById("alerta-offline").style.display = "block";
                document.getElementById("motor-box").style.background = "#444"; 
                document.getElementById("card-temp").style.background = "#333";
                document.getElementById("card-comb").style.background = "#333";
                
                let tanqueWrapper = document.getElementById("tanque-wrapper");
                tanqueWrapper.classList.remove("derrame");
                let barraTanque = document.getElementById("tanque-nivel");
                barraTanque.style.height = "0%";
                barraTanque.style.backgroundColor = "transparent";

                let termLiquido = document.getElementById("term-liquido");
                termLiquido.setAttribute("height", "0");
                
                document.getElementById("temp-val").innerText = "-- °C";
                document.getElementById("comb-val").innerText = "-- %";
                
                let lblEstado = document.getElementById("temp-estado");
                lblEstado.className = "";
                lblEstado.style.color = "#888";
                lblEstado.innerText = "Sin señal del sensor";

                let lblCombEstado = document.getElementById("comb-estado");
                lblCombEstado.className = "";
                lblCombEstado.style.color = "#888";
                lblCombEstado.innerText = "Sin señal del sensor";
            }
        }

        setInterval(actualizarDatos, 3000);
        setInterval(comprobarConexion, 1000);
    </script>

</body>
</html>
