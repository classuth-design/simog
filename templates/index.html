<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SCADA - Monitoreo de Generador</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .metrics-panel { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; gap: 20px; }
        .card { background: #2c2c2c; padding: 20px; border-radius: 8px; width: 45%; box-sizing: border-box; }
        .scada-container { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 20px; background: #2c2c2c; padding: 20px; border-radius: 8px; }
        .motor-box { background: #6c757d; padding: 30px; border-radius: 8px; font-weight: bold; color: #fff; }
        
        /* Contenedor del Tanque de Combustible */
        .tanque-wrapper { width: 80px; height: 160px; border: 3px solid #ccc; border-radius: 6px; position: relative; background: #111; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .tanque-nivel { width: 100%; height: 0%; transition: height 0.5s ease, background-color 0.5s ease; }
        .tanque-label { font-size: 0.9rem; margin-top: 5px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel SCADA - Generador Principal</h2>

        <!-- Esquema Visual SCADA -->
        <div class="scada-container">
            <div class="motor-box">
                MOTOR / CUMMINS
            </div>
            <div>
                <div class="tanque-wrapper">
                    <!-- Barra de nivel dinámica -->
                    <div id="tanque-nivel" class="tanque-nivel"></div>
                </div>
                <div class="tanque-label">COMBUSTIBLE</div>
            </div>
        </div>

        <!-- Tarjetas de Métricas Numéricas -->
        <div class="metrics-panel">
            <div class="card">
                <h3>Temperatura</h3>
                <h2 id="temp-val">-- °C</h2>
            </div>
            <div class="card">
                <h3>Combustible</h3>
                <h2 id="comb-val">-- %</h2>
            </div>
        </div>
    </div>

    <script>
        function actualizarDatos() {
            // Consulta a la API Flask para obtener el último estado del generador ID 1
            fetch('/api/estado/1')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.log("Sin datos aún");
                        return;
                    }

                    let temperatura = data.temperatura;
                    let combustible = data.nivel_combustible;

                    // Actualizar textos en pantalla
                    document.getElementById("temp-val").innerText = temperatura.toFixed(2) + " °C";
                    document.getElementById("comb-val").innerText = combustible.toFixed(1) + " %";

                    // Lógica de colores y llenado del tanque según los rangos solicitados
                    let barraTanque = document.getElementById("tanque-nivel");
                    barraTanque.style.height = combustible + "%";

                    if (combustible <= 0) {
                        barraTanque.style.backgroundColor = "transparent"; // Vacío
                    } else if (combustible > 0 && combustible <= 20) {
                        barraTanque.style.backgroundColor = "#dc3545"; // Rojo (1% - 20%)
                    } else if (combustible > 20 && combustible <= 30) {
                        barraTanque.style.backgroundColor = "#fd7e14"; // Naranja (21% - 30%)
                    } else {
                        barraTanque.style.backgroundColor = "#28a745"; // Verde (> 30%)
                    }
                })
                .catch(error => console.error("Error al obtener telemetría:", error));
        }

        // Ejecutar inmediatamente y luego actualizar cada 3 segundos
        actualizarDatos();
        setInterval(actualizarDatos, 3000);
    </script>

</body>
</html>
